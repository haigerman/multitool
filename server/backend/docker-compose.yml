# Speedtest-Backend für Intrepid Multitool
# Start:  docker compose up -d   (im Verzeichnis dieser Datei)
services:
  speedtest:
    image: nginx:1.27-alpine
    container_name: intrepid-speedtest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8089"          # nur lokal, der Webserver davor macht HTTPS
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/data:ro
