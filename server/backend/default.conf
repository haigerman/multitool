# nginx-Backend für den Speedtest (läuft im Container, nur auf 127.0.0.1:8089 erreichbar).
# Der bestehende Webserver leitet https://home.winterkind.me/speedtest/ hierher weiter.
server {
    listen 8089;
    access_log off;

    location = /speedtest/ping {
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location = /speedtest/download.bin {
        root /data;                      # Testdatei: /data/speedtest/download.bin
        types { }
        default_type application/octet-stream;
        gzip off;
        sendfile on;
        add_header Cache-Control "no-store" always;
    }

    location = /speedtest/upload {
        client_max_body_size 0;
        client_body_buffer_size 1m;
        add_header Cache-Control "no-store" always;
        return 204;                      # nginx liest den Body vollständig und verwirft ihn
    }

    location / { return 404; }
}
