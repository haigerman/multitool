# Intrepid Multitool – Speedtest-Endpunkte
#
# In den bestehenden server-Block für home.winterkind.me (Port 443, TLS) einbinden, z. B.:
#     include /etc/nginx/snippets/speedtest.conf;
#
# Die App ruft auf:
#   GET  https://home.winterkind.me/speedtest/ping          -> 204, leer (Latenz)
#   GET  https://home.winterkind.me/speedtest/download.bin  -> große Zufallsdatei (Download)
#   POST https://home.winterkind.me/speedtest/upload        -> Body wird verworfen, 204 (Upload)

location = /speedtest/ping {
    access_log off;
    add_header Cache-Control "no-store" always;
    return 204;
}

location = /speedtest/download.bin {
    access_log off;
    root /var/www;                       # Datei liegt in /var/www/speedtest/download.bin
    types { }
    default_type application/octet-stream;
    gzip off;                            # Zufallsdaten nicht komprimieren
    sendfile on;
    tcp_nopush on;
    add_header Cache-Control "no-store" always;
}

location = /speedtest/upload {
    access_log off;
    client_max_body_size 0;              # keine Größenbegrenzung für den Upload-Test
    client_body_buffer_size 1m;
    client_body_timeout 30s;
    add_header Cache-Control "no-store" always;
    # nginx liest und verwirft den Request-Body, bevor die Verbindung geschlossen wird.
    return 204;
}
