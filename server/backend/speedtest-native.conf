# nginx-Backend für den Speedtest (natives nginx, nur auf 127.0.0.1:8089 erreichbar).
# Caddy leitet https://home.winterkind.me/speedtest/* hierher weiter.
#
# Schutz:
#  1. Nur Anfragen mit dem richtigen Header "X-Intrepid-Key" werden beantwortet, alle anderen
#     bekommen 404. Den Platzhalter SCHLUESSEL_HIER_EINTRAGEN durch den eigenen Schlüssel ersetzen
#     (derselbe Wert wie im GitHub-Secret SPEEDTEST_KEY).
#  2. Pro Client-IP höchstens 4 gleichzeitige Verbindungen und begrenzte Anfragerate.

limit_conn_zone $binary_remote_addr zone=speedtest_conn:1m;
limit_req_zone  $binary_remote_addr zone=speedtest_ping:1m rate=2r/s;
limit_req_zone  $binary_remote_addr zone=speedtest_data:1m rate=10r/s;

server {
    listen 127.0.0.1:8089;
    access_log off;

    # Echte Client-IP aus dem von Caddy gesetzten X-Forwarded-For übernehmen,
    # sonst gälten alle Limits gemeinsam für 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;

    if ($http_x_intrepid_key != "SCHLUESSEL_HIER_EINTRAGEN") {
        return 404;
    }

    limit_conn speedtest_conn 4;
    limit_conn_status 429;
    limit_req_status 429;

    # Ping und Upload laufen über den internen Server unten: "return" direkt hier würde
    # antworten, bevor nginx die Limits prüft.
    location = /speedtest/ping {
        limit_req zone=speedtest_ping burst=20 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8090;
    }

    location = /speedtest/download.bin {
        limit_req zone=speedtest_data burst=100 nodelay;
        root /var/www;                   # Testdatei: /var/www/speedtest/download.bin
        types { }
        default_type application/octet-stream;
        gzip off;
        sendfile on;
        add_header Cache-Control "no-store" always;
    }

    location = /speedtest/upload {
        limit_req zone=speedtest_data burst=100 nodelay;
        # Body komplett im Speicher empfangen, erst dann antworten. Sonst antwortet nginx zu
        # früh und der Upload würde falsch gemessen. Die App sendet 16-MB-Blöcke.
        client_max_body_size 17m;
        client_body_buffer_size 17m;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8090;
    }

    location / { return 404; }
}

# Interner Hilfsserver: beantwortet Ping und Upload mit 204 und verwirft hochgeladene Daten.
server {
    listen 127.0.0.1:8090;
    access_log off;
    client_max_body_size 0;
    location / { return 204; }
}
